; ============================================================
;  Dievon - PHP entry-point defaults
; ============================================================
; Honoured by PHP-FPM / CGI (Hostinger). Silently ignored under mod_php,
; which is why config.php also sets these via session_set_cookie_params()
; - between them every entry point is covered.
;
; This exists for direct hits to actions/*.php and admin/*.php, which call
; session_start() before they load config.php and would otherwise get PHP's
; wide-open defaults.
;
; session.cookie_secure is deliberately NOT set here. It cannot be made
; conditional in an ini file, and forcing it on would break local MAMP over
; plain HTTP. config.php sets it per-request after testing for HTTPS.

session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; NOT SET HERE, deliberately: session.name
;
; A custom name (DIEVONSESS) would stop this shop sharing one session with the
; other MAMP projects under localhost:8888 - which is why an "Afghan Meva Ice
; Cream Tub" from the Creamybite project can appear in the Dievon bag.
;
; It was tried and reverted. PHP caches .user.ini per directory for
; user_ini.cache_ttl (300s), and those caches expire at different moments for
; /, /actions and /admin. Measured live, the cookie name flapped between
; DIEVONSESS and PHPSESSID from one request to the next, so a shopper's cart
; would vanish at random as it flipped. Losing carts is far worse than the
; local-only confusion it fixes.
;
; It is not a problem on the live site: hello.dievon.com is its own host, so
; nothing else shares its cookies. If it ever needs solving locally, the safe
; way is to run each project on its own port or hostname, not to rename the
; cookie under a cached ini.

; Do not leak PHP version in the Server header.
expose_php = Off
